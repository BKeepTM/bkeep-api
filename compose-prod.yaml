services:
  database:
    container_name: bkeep_mysql
    image: mysql:9.1
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    ports:
      - "3306:3306"
    networks:
      - bkeep-api
    volumes:
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
          test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
          timeout: 20s
          retries: 10
  web:
    container_name: bkeep_web
    image: bkeepapi/bkeep-api:0.0.2
    ports:
      - "80:80"
    networks:
      - bkeep-api
    depends_on:
      database:
        condition: service_healthy
    env_file: ".env"
networks:
    bkeep-api: