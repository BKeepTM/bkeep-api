services:
  database:
    container_name: bkeep_mysql
    image: mysql:9.1
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    ports:
      - "3306:3306"
    networks:
      - bkeep_api
    volumes:
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
          test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
          timeout: 20s
          retries: 10
  web:
    container_name: bkeep_web
    image: bkeepapi/bkeep-api:0.0.1
    ports:
      - "3000:3000"
    networks:
      - bkeep_api
    depends_on:
      database:
        condition: service_healthy
    env_file: ".env"
    restart: on-failure:5 
networks:
    bkeep_api: