services:
  database:
    container_name: express_mysql
    image: mysql:9.1
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    ports:
      - "3306:3306"
    networks:
      - express
    volumes:
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
          test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
          timeout: 20s
          retries: 10
  web:
    container_name: express_web
    build: .
    volumes:
      - type: bind
        source: ./
        target: /usr/src/app
    depends_on:
        database:
          condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - express
    env_file: ".env"
  phpmyadmin:
    container_name: express_phpmyadmin
    image: phpmyadmin/phpmyadmin
    depends_on:
      - database
    ports:
      - "8080:80"
    environment:
      PMA_HOST: express_mysql
      PMA_PORT: 3306
    networks:
      - express
networks:
    express: